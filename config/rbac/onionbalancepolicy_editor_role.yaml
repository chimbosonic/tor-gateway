# This rule is not used by the project tor-gateway itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the policy.torgateway.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: tor-gateway
    app.kubernetes.io/managed-by: kustomize
  name: onionbalancepolicy-editor-role
rules:
- apiGroups:
  - policy.torgateway.io
  resources:
  - onionbalancepolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - policy.torgateway.io
  resources:
  - onionbalancepolicies/status
  verbs:
  - get
