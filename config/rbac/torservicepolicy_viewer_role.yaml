# This rule is not used by the project tor-gateway itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to policy.torgateway.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: tor-gateway
    app.kubernetes.io/managed-by: kustomize
  name: torservicepolicy-viewer-role
rules:
- apiGroups:
  - policy.torgateway.io
  resources:
  - torservicepolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - policy.torgateway.io
  resources:
  - torservicepolicies/status
  verbs:
  - get
