# This rule is not used by the project tor-gateway itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over policy.torgateway.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: tor-gateway
    app.kubernetes.io/managed-by: kustomize
  name: torservicepolicy-admin-role
rules:
- apiGroups:
  - policy.torgateway.io
  resources:
  - torservicepolicies
  verbs:
  - '*'
- apiGroups:
  - policy.torgateway.io
  resources:
  - torservicepolicies/status
  verbs:
  - get
