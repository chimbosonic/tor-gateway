{{- if .Values.crds.install -}}
{{- /* Each file in files/crds/ (generated by `make chart-sync`) begins with its
       own `---`, so this template must NOT add a separator — doing so would
       emit empty documents. */}}
{{- range $path, $_ := .Files.Glob "files/crds/*.yaml" }}
{{ $.Files.Get $path }}
{{- end }}
{{- end }}
