{{- if .Values.gatewayClass.install -}}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gatewayClass.name }}
  labels: {{- include "tor-gateway.labels" . | nindent 4 }}
spec:
  controllerName: {{ .Values.gatewayClass.controllerName }}
  # Gateway API caps GatewayClass.spec.description at 64 characters.
  description: Exposes Gateways as Tor v3 hidden services (.onion).
{{- end }}
