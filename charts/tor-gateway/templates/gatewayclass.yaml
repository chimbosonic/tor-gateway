{{- if .Values.gatewayClass.install -}}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gatewayClass.name }}
  labels: {{- include "tor-gateway.labels" . | nindent 4 }}
spec:
  controllerName: {{ .Values.gatewayClass.controllerName }}
  description: |
    GatewayClass for tor-gateway. Gateways referencing this class will be
    provisioned as Tor v3 hidden services. The .onion address is published
    in Gateway.status.addresses (type: Hostname) once the Tor daemon
    establishes introduction points.
{{- end }}
