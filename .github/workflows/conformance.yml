name: Conformance

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  conformance:
    name: Gateway API conformance
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # Force the Makefile to use docker even though local dev defaults to
    # podman. GitHub-hosted ubuntu-latest ships docker; kind's
    # `load docker-image` resolves images from docker's local store.
    env:
      CONTAINER_TOOL: docker
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          curl -Lo ./kind "https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Run upstream Gateway API conformance suite
        # The Makefile target builds the manager image, loads it into Kind,
        # installs CRDs and the operator, then runs the conformance suite
        # with the features we currently claim. See test/conformance.
        run: |
          go mod tidy
          make test-conformance
