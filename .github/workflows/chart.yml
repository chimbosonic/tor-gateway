name: Helm chart

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
      - ".github/workflows/chart.yml"
  pull_request:
    paths:
      - "charts/**"
      - ".github/workflows/chart.yml"

permissions: {}

jobs:
  lint-and-template:
    name: Lint and render
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Helm
        uses: azure/setup-helm@v4
      - name: Helm lint
        run: helm lint charts/tor-gateway
      - name: Render templates
        run: helm template tor-gateway charts/tor-gateway > /tmp/rendered.yaml
      - name: Install kubeconform
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform
      - name: Validate rendered manifests
        # Allow the Gateway API CRD types since they are not in the default schema set.
        run: |
          kubeconform \
            -strict \
            -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/rendered.yaml
