name: Helm chart

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
      - "config/rbac/**"
      - "config/crd/**"
      - "Makefile"
      - ".github/workflows/chart.yml"
  pull_request:
    paths:
      - "charts/**"
      - "config/rbac/**"
      - "config/crd/**"
      - "Makefile"
      - ".github/workflows/chart.yml"

permissions: {}

jobs:
  lint-and-template:
    name: Lint and render
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Helm
        uses: azure/setup-helm@v4
      - name: Install yq
        run: |
          # Pinned: chart-sync's output must match the yq version that generated the committed files/.
          sudo curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.53.2/yq_linux_amd64 \
            -o /usr/local/bin/yq && sudo chmod +x /usr/local/bin/yq
      - name: Verify chart is in sync with config/
        run: |
          make chart-sync
          git diff --exit-code charts/ \
            || { echo "::error::charts/ is out of sync with config/. Run 'make chart-sync' and commit."; exit 1; }
      - name: Helm lint
        run: helm lint charts/tor-gateway
      - name: Render templates
        run: helm template tor-gateway charts/tor-gateway > /tmp/rendered.yaml
      - name: Install kubeconform
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform
      - name: Validate rendered manifests
        # Allow the Gateway API CRD types since they are not in the default schema set.
        run: |
          kubeconform \
            -strict \
            -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/rendered.yaml
