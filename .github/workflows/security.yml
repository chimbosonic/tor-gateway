name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily 02:17 UTC — keep govulncheck honest against newly published CVEs.
    - cron: "17 2 * * *"

permissions: {}

jobs:
  govulncheck:
    name: govulncheck
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  gosec:
    name: gosec
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Run gosec
        uses: securego/gosec@master
        with:
          args: "-no-fail -fmt sarif -out gosec.sarif ./..."
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gosec.sarif

  trivy-fs:
    name: trivy filesystem scan
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          # `config` is the legacy name for misconfig; keep it for action compatibility.
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy.sarif
          exit-code: "1"
          # Directories deliberately skipped:
          #   charts/           Trivy's helm scanner defaults to k8s v1.20 and
          #                     fails to render our >=1.30 chart. The dedicated
          #                     `chart` workflow exercises it via helm lint +
          #                     kubeconform.
          #   config/           Kubebuilder-scaffolded kustomize manifests
          #                     (RBAC, manager, network-policy) flagged by the
          #                     misconfig scanner for stylistic upstream
          #                     defaults we don't want gated on.
          #   .github/          The workflow YAMLs themselves; trivy's
          #                     misconfig rules for GH Actions are out of
          #                     scope for this project.
          skip-dirs: "charts,config,.github"
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
