name: E2E Tests

# E2E spins up Kind, builds and loads images, applies the operator, and
# exercises live reconcilers. Costs 3-5 minutes per run; we gate every PR
# on the faster conformance and unit/envtest suites instead and run e2e
# on push-to-main and a nightly cron so regressions surface within 24h.
on:
  push:
    branches: [main]
  schedule:
    # Daily at 03:17 UTC.
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  test-e2e:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    # CI uses docker; see comments in conformance.yml.
    env:
      CONTAINER_TOOL: docker
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind "https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Running Test e2e
        run: |
          go mod tidy
          make test-e2e
